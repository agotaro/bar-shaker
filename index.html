<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Shaker</title>
<style>
:root{
  --bg:#17111a; --panel:#261c2b; --panel2:#332538; --line:#4a3a50;
  --text:#f6ecdf; --muted:#b9a7b3; --accent:#f3b95f; --good:#84d59a; --bad:#f28b8b; --info:#8fd3ff;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{max-width:760px;margin:0 auto;padding:12px 16px 32px}
header{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px;gap:8px;flex-wrap:wrap}
header .title{font-weight:700;font-size:18px;letter-spacing:.02em}
.stats{display:flex;gap:12px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.stats b{color:var(--accent);font-size:16px}
.title .nightTag{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.title .nightTag b{color:var(--accent)}
.clockrow{display:flex;align-items:center;gap:10px;margin:-2px 0 10px}
.clockrow b{font-size:18px;font-variant-numeric:tabular-nums;min-width:50px}
.daybar{flex:1;height:8px;background:var(--panel2);border-radius:99px;position:relative;overflow:hidden}
.daybar>div{height:100%;width:0;background:linear-gradient(90deg,#f3b95f,#8fd3ff);border-radius:99px}
.daybar>i{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.8}
.clockrow small{color:var(--muted);font-size:12px;min-width:84px;text-align:right}
.pts{color:var(--info)}
.combo{color:var(--bad);font-weight:700}
.hi{color:var(--accent);font-weight:700}
.achToast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--accent);color:#2a1c22;padding:8px 16px;border-radius:12px;font-size:14px;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:achin .35s cubic-bezier(.2,.9,.3,1.3);white-space:nowrap}
@keyframes achin{0%{transform:translate(-50%,-20px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
.achlist{text-align:left;margin-top:8px;max-height:60vh;overflow:auto}
.achlist h4{margin:12px 0 6px;font-size:13px;color:var(--muted);letter-spacing:.1em}
.ach{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;background:var(--panel2);margin-bottom:6px;font-size:13px}
.ach.locked{opacity:.45}
.ach .ic{font-size:18px;flex:none}
.ach b{display:block;font-size:14px}
.ach small{color:var(--muted)}
.card button.ghost.small{font-size:13px;padding:8px 14px;margin-top:6px}

.seats{display:grid;gap:8px;margin-bottom:10px}
.seat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;cursor:pointer;min-height:64px;position:relative;transition:border-color .15s}
.seat.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.seat.empty{justify-content:center;color:var(--muted);font-size:13px;cursor:default;border-style:dashed}
.seat.done{opacity:.7}
.seat-art{width:44px;height:44px;flex:none;position:relative}
.seat-art svg{width:100%;height:100%;display:block}
.seat-art .badge{position:absolute;right:-7px;bottom:-7px;font-size:17px;line-height:1}
.seat-info{min-width:0;flex:1}
.seat-info b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat-info b em{font-style:normal;color:var(--accent);font-size:10px;letter-spacing:-1px}
.seat-info .so{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .pat{height:5px;background:var(--panel2);border-radius:99px;margin-top:5px;overflow:hidden}
.seat .pat>div{height:100%;background:var(--good)}
@media (max-width:480px){.seat{flex-direction:column;text-align:center;padding:8px 4px}.seat-info{width:100%}.seat-info b{font-size:12px}}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.customer{display:flex;gap:14px;align-items:flex-start}
.avatar{width:88px;height:88px;flex:none;position:relative;filter:drop-shadow(0 6px 12px rgba(0,0,0,.4))}
.avatar .art,.avatar .art svg{width:100%;height:100%;display:block}
.avatar .face{position:absolute;right:-8px;bottom:-6px;font-size:28px;line-height:1}
.cwrap{flex:1;min-width:0}
.who{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:baseline;min-height:19px}
.who b{color:var(--text);font-size:16px}
.who .aff{color:var(--accent);font-size:12px}
.bubble{position:relative;background:#fff8ee;color:#2a1c22;border-radius:14px;padding:12px 14px;min-height:64px;font-size:16px;line-height:1.5}
.bubble:before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:#fff8ee;border-left:0}
.bubble .type{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#2a1c22;color:#fff;margin-bottom:6px;letter-spacing:.05em}
.bubble .muted{color:#8a7a80}
.bubble .moodchip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#ffe3a8;color:#4a3210;margin:0 0 6px 6px;font-weight:700}
.bubble .pay{margin-top:6px;font-size:14px}
.busy{margin-top:12px}
.busy-label{font-size:13px;color:var(--info);margin-bottom:4px}
.busy-bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden}
.busy-bar>div{height:100%;background:var(--info);width:0}

.bar{display:flex;gap:16px;align-items:center;background:linear-gradient(180deg,#3a2a24,#2b1e1a);border:1px solid #5a4238;border-radius:16px;padding:14px;margin-bottom:12px}
.glass{width:84px;height:120px;border:3px solid #e8dccf;border-top:none;border-radius:0 0 22px 22px;background:rgba(255,255,255,.04);display:flex;flex-direction:column-reverse;overflow:hidden;flex:none;position:relative}
.glass .layer{height:25%}
.glass:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 30%,transparent 70%,rgba(255,255,255,.08));pointer-events:none}
.glass-side{flex:1;min-width:0}
.glass-items{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;margin-bottom:10px}
.chip{background:rgba(0,0,0,.25);border:1px solid #6a5048;border-radius:999px;padding:5px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip .x{opacity:.55;margin-left:4px}
.glass-items .empty{color:var(--muted);font-size:13px;align-self:center}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions button{padding:10px 16px;border-radius:12px;font-weight:700;background:rgba(0,0,0,.25);border:1px solid #6a5048}
.actions button.primary{background:var(--accent);color:#2a1c22;border-color:transparent;flex:1}
.actions button:disabled{opacity:.4;cursor:default}
.subst{margin-top:8px;width:100%;padding:8px 12px;border-radius:10px;background:rgba(143,211,255,.12);border:1px dashed var(--info);color:var(--info);font-size:13px;text-align:left}
.toast{font-size:13px;color:var(--info);min-height:18px;margin-top:8px}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-bottom:12px}
.shelf button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .08s,background .2s}
.shelf button:active{transform:scale(.95)}
.shelf button.in{background:var(--panel2);border-color:var(--accent)}
.shelf button.out{opacity:.45}
.bottle{position:relative;width:22px;height:46px;display:inline-block;flex:none}
.bottle .neck{position:absolute;top:0;left:6px;width:10px;height:10px;border-radius:3px 3px 0 0;background:var(--c);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.bottle .body{position:absolute;top:8px;left:0;right:0;bottom:0;border-radius:5px 5px 7px 7px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25);overflow:hidden}
.bottle .liq{position:absolute;left:0;right:0;bottom:0;background:var(--c)}
.shelf .name{font-size:13px;font-weight:600}
.tags{display:flex;gap:3px}
.tags span{font-size:10px;padding:1px 5px;border-radius:4px;background:var(--panel2);color:var(--muted)}
.cnt{font-size:11px;color:var(--muted)}
.cnt.zero{color:var(--bad);font-weight:700}

.choices{display:grid;gap:8px;margin-bottom:12px}
.choices button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.choices button small{color:var(--muted);font-size:12px;white-space:nowrap}
.choices button:hover{border-color:var(--accent)}

details.recipes{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:14px}
details.recipes summary{cursor:pointer;color:var(--text);font-weight:600}
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 16px;margin-top:10px}
.recipe-grid div b{color:var(--text)}
.legend{margin-top:12px;font-size:12px;line-height:1.6}

.overlay{position:fixed;inset:0;background:rgba(12,8,14,.88);display:flex;justify-content:center;align-items:flex-start;padding:20px;z-index:10;overflow:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 24px;max-width:500px;width:100%;text-align:center;margin:auto}
.card h1{margin:0 0 6px;font-size:26px}
.card h3{margin:14px 0 6px;font-size:16px}
.card hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.card p{color:var(--muted);line-height:1.7;margin:8px 0}
.card .big{font-size:40px;color:var(--accent);font-weight:800;margin:6px 0}
.card button{margin-top:10px;padding:12px 28px;border-radius:12px;background:var(--accent);color:#2a1c22;font-weight:700;font-size:16px}
.card button.ghost{background:var(--panel2);color:var(--text);font-size:14px;padding:10px 18px}
.card button:disabled{opacity:.4;cursor:default}
.card .diffs{display:grid;gap:8px;margin-top:6px}
.card button.diff{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--panel2);color:var(--text);padding:10px 14px;margin:0;border:1px solid var(--line)}
.card button.diff small{color:var(--muted);font-weight:400;font-size:12px;line-height:1.5}
.card button.diff:hover{border-color:var(--accent)}
.card button.diff.sel{border-color:var(--accent);background:#3b2a45;box-shadow:0 0 0 1px var(--accent)}
.card p.sec{margin:12px 0 4px;text-align:left;font-size:13px;color:var(--text);font-weight:700}
.rank{font-size:56px;font-weight:900;color:var(--accent);line-height:1}
.lineup{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0 6px}
.mini{position:relative;width:46px;height:46px}
.mini svg{width:100%;height:100%;display:block}
.mini span{position:absolute;right:-6px;bottom:-6px;font-size:17px;line-height:1}
.mini .st{position:static;display:block;font-size:9px;color:var(--accent);text-align:center;letter-spacing:-1px}
.cast{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 4px}
.cast .mini{width:38px;height:38px}
.notes{font-size:13px;color:var(--muted);line-height:1.7;margin-top:6px}
.restock{text-align:left;margin-top:8px;max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.rrow{display:grid;grid-template-columns:22px 1fr 46px 48px auto auto;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px}
.rrow:last-child{border-bottom:none}
.rrow .bottle{transform:scale(.7);transform-origin:left center;height:40px}
.rrow .rs{color:var(--muted);font-variant-numeric:tabular-nums}
.rrow .rs.zero{color:var(--bad);font-weight:700}
.rrow .rp{color:var(--muted);font-variant-numeric:tabular-nums}
.card .rrow button{padding:4px 9px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;margin:0;color:var(--text)}

.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
.enter{animation:enter .4s cubic-bezier(.2,.9,.3,1.3)}
@keyframes enter{0%{transform:translateY(14px) scale(.85);opacity:0}100%{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">🍸 Bar Shaker <span class="nightTag">夜 <b id="night">1</b>/7</span></div>
    <div class="stats"><span>スコア <b id="score">0</b></span><span>今夜 <b id="sales">¥0</b></span><span>所持金 <b id="money">¥0</b></span></div>
  </header>
  <div class="clockrow"><b id="clock">19:00</b><div class="daybar"><div id="dayFill"></div><i id="loMark"></i></div><small id="clockNote">開店</small></div>

  <section class="seats" id="seats"></section>

  <section class="stage" id="stage">
    <div class="customer">
      <div class="avatar" id="avatar"><div class="art" id="avatarArt"></div><span class="face" id="face"></span></div>
      <div class="cwrap">
        <div class="who"><b id="cname"></b><span id="ctitle"></span><span class="aff" id="caff"></span></div>
        <div class="bubble" id="bubble"><div class="muted">…</div></div>
      </div>
    </div>
    <div class="busy" id="busy" hidden><div class="busy-label" id="busyLabel"></div><div class="busy-bar"><div id="busyBar"></div></div></div>
  </section>

  <section class="bar" id="bar">
    <div class="glass" id="glass"></div>
    <div class="glass-side">
      <div class="glass-items" id="glassItems"></div>
      <div class="actions">
        <button id="serve" class="primary">提供する</button>
        <button id="clear">捨てる</button>
      </div>
      <button id="subst" class="subst" hidden></button>
      <div class="toast" id="toast"></div>
    </div>
  </section>

  <section class="shelf" id="shelf"></section>
  <section class="choices" id="choices" hidden></section>

  <details class="recipes" id="recipes">
    <summary>📖 レシピ帳</summary>
    <div class="recipe-grid" id="recipeList"></div>
    <div class="legend">素材の特徴: 強=アルコール / 甘 / 酸 / 爽=さっぱり / 苦 / 果=フルーティ。ふわっとした注文は、この特徴の合計で判定されます。※レシピはお店独自の簡易版です。</div>
  </details>

  <div class="overlay" id="overlay"><div class="card" id="card"></div></div>
</div>

const mocktail=c=>{const ids=c.ings.filter(id=>!BY_ID[id].tags.strong);if(ids.length<2)ids.push(ids.includes('lime')?'soda':'lime');return ids};
const BADGE={perfect:'😆',partial:'😐',fail:'😠',left:'💨'};

const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const yen=n=>'¥'+n.toLocaleString();
function profile(glass){const p={};glass.forEach(i=>{for(const k in i.tags)p[k]=(p[k]||0)+i.tags[k]});return p}
function matchCocktail(glass){const ids=glass.map(i=>i.id).sort().join(',');return COCKTAILS.find(c=>c.ings.slice().sort().join(',')===ids)}
function countsOf(ids){const c={};ids.forEach(id=>c[id]=(c[id]||0)+1);return c}
function msJaccard(a,b){const ca=countsOf(a),cb=countsOf(b);let inter=0,union=0;new Set([...a,...b]).forEach(k=>{inter+=Math.min(ca[k]||0,cb[k]||0);union+=Math.max(ca[k]||0,cb[k]||0)});return union?inter/union:0}
function balance(glass){const total=glass.length,sp=glass.filter(i=>i.tags.strong).length,p=profile(glass);return {total,spirits:sp,tooStrong:sp>=3||(total>=2&&sp/total>0.5),tooSweet:(p.sweet||0)>=5}}
function dominantWord(ids){const p=profile(ids.map(id=>BY_ID[id]));let best=null;for(const k in p){if(!best||p[k]>p[best])best=k}return best?TAGWORD[best]:''}
function bottleHtml(ing){const st=G?G.stock[ing.id]:ing.cap;const lv=Math.round(100*st/ing.cap);return `<span class="bottle" style="--c:${ing.color}"><i class="neck"></i><i class="body"><i class="liq" style="height:${lv}%"></i></i></span>`}

/* ---------- 注文の生成 ---------- */
const namedOrder=ch=>{
  const c=rnd(COCKTAILS);
  const o={kind:'named',cocktail:c,text:`${c.name}、ひとつ。`,label:'カクテル',summary:c.name,pay:450};
  const spirit=c.ings.find(id=>BY_ID[id].tags.strong);
  if(ch&&spirit&&c.ings.length<=3){
    let mod=null;
    if(ch.mod&&Math.random()<0.5) mod=ch.mod;
    else if(Math.random()<0.3){ if(ch.likes.includes('strong')) mod='strong'; else if(ch.hates.includes('strong')) mod=Math.random()<0.5?'weak':'na'; }
    if(mod==='strong'){o.mod='strong';o.text=`${c.name}、濃いめで。`;o.summary=`${c.name}（濃いめ）`;o.pay=520}
    else if(mod==='weak'){o.mod='weak';o.text=`${c.name}。明日早いから、薄めで。`;o.summary=`${c.name}（薄め）`;o.pay=480}
    else if(mod==='na'){
      o.mod='na';o.na=mocktail(c);const added=o.na.find(id=>!c.ings.includes(id));
      o.text=`${c.name}のノンアルで。${BY_ID[spirit].name}抜き${added?'で、'+BY_ID[added].name+'を足して':'で'}ね。`;o.summary=`${c.name}（ノンアル）`;o.pay=430;
    }
  }
  return o;
};
const KIND_W={named:30,abstract:12,omakase:8,mood:12,like:10,same:8,bulk:5,wild:15};
function pickKind(ch,ns){
  const w={...KIND_W};
  if(ch.fav) for(const k in ch.fav) if(w[k]!=null) w[k]*=ch.fav[k];
  if(!ns.lastDrink||ns.lastDrink.name===ch.name) w.same=0;
  if(!ABSTRACT.some(a=>a.who.includes(ch.id))) w.abstract=0;
  const total=Object.values(w).reduce((a,b)=>a+b,0); let r=Math.random()*total;
  for(const k in w){r-=w[k];if(r<0)return k}
  return 'named';
}
function makeOrder(ch,m,ns){
  const hasMem=!!(m.usual||(m.last&&m.last.length));
  if(hasMem&&ns.mem<3&&Math.random()<0.3){
    ns.mem++;
    if(m.usual&&m.aff>=2){
      const text=m.aff>=3?'いつもの。':`いつもの${dominantWord(m.usual)}やつ。`;
      return {kind:'usual',glass:m.usual,text,label:'常連',summary:'いつもの',pay:520};
    }
    const last=m.last||m.usual;
    const key=last.find(id=>BY_ID[id].tags.strong)||last[0];
    const text=m.aff<=1?`前回と同じの。えっと、${BY_ID[key].name}が入ってたやつ。`:'また来たよ。前回と同じの、もう一杯。';
    return {kind:'repeat',glass:last,text,label:'前回と同じ',summary:'前回と同じ',pay:480};
  }
  const k=pickKind(ch,ns);
  if(k==='abstract'){const d=rnd(ABSTRACT.filter(a=>a.who.includes(ch.id)));return {kind:'abstract',def:d,text:d.text,label:'ふわっとした注文',summary:'ふわっと',pay:450}}
  if(k==='omakase') return {kind:'omakase',text:'おまかせで。',label:'おまかせ',summary:'おまかせ',pay:450};
  if(k==='mood'){
    const keys=Object.keys(MOODS).filter(x=>!((x==='hyped'||x==='down')&&ch.hates.includes('strong')));
    const mk=(ch.mood&&keys.includes(ch.mood)&&Math.random()<0.6)?ch.mood:rnd(keys), md=MOODS[mk];
    return {kind:'mood',moodKey:mk,mood:md,text:mk==='rush'?'なんでもいい、早く！':'今日はなんか、こう…ね？',label:'今日の気分',summary:`${md.icon} ${md.name}`,pay:Math.round(450*(md.pay||1))};
  }
  if(k==='like'){const c=rnd(COCKTAILS.filter(x=>x.ings.length>=2));return {kind:'like',cocktail:c,text:`${c.name}っぽいの、なんか作って。`,label:'アレンジ',summary:`${c.name}っぽい`,pay:500}}
  if(k==='same'){const ld=ns.lastDrink;return {kind:'same',glass:ld.ids,text:`さっき${ld.name}が飲んでたやつ、同じのを。`,label:'同じもの',summary:`${ld.name}と同じ`,pay:470}}
  if(k==='bulk'){
    const n=ch.bulkCount||3, c=rnd(COCKTAILS.filter(x=>x.ings.length<=3));
    const text=n===2?`${c.name}を2つ。「同じの！」「同じの！」`:`${c.name}を${n}杯！みんなで乾杯するんだ。`;
    return {kind:'named',cocktail:c,count:n,served:0,grades:[],money:0,text,label:'乾杯',summary:`${c.name} ×${n}`,pay:450};
  }
  if(k==='wild'){const wildC=WILD.filter(w=>w.who.includes(ch.id));const w=rnd(wildC.length?wildC:WILD);return {kind:'wild',def:w,text:w.text,label:'無茶ぶり',summary:'無茶ぶり'}}
  return namedOrder(ch);
}


/* ---------- 夜の進行 ---------- */
function pickArrival(){
  const h=N.clock;
  const all=CHARS.filter(c=>G.roster.includes(c.id)&&!N.absent.includes(c.id)&&(N.visits[c.id]||0)<(2+(G.mem[c.id].aff>=2?1:0)));
  if(!all.length) return null;
  const inWin=c=>h>=c.hours[0]&&h<c.hours[1];
  const cands=all.filter(inWin).length?all.filter(inWin):all;
  const ranked=cands.map(c=>({c,w:(1+G.mem[c.id].aff)*((N.visits[c.id]||0)?0.25:1)*(0.5+Math.random())})).sort((a,b)=>b.w-a.w);
  const ch=ranked[0].c;
  N.visits[ch.id]=(N.visits[ch.id]||0)+1;
  let o;
  if(G.night===1&&N.customers===0) o=namedOrder();
  else{o=makeOrder(ch,G.mem[ch.id],N);if(o.kind==='wild'){N.wild++;if(N.wild>3)o=namedOrder(ch)}}
  if(N.visits[ch.id]>1) o.revisit=true;
  return {char:ch,order:o};
}
function arrivalGap(){const h=N.clock;const base=(h>=21&&h<24)?2.5+Math.random()*2:4+Math.random()*3;return base*D.gap}
function fmtClock(h){const hh=Math.floor(h)%24,mm=Math.floor((h-Math.floor(h))*60);return `${hh}:${String(mm).padStart(2,'0')}`}
function renderClock(){
  $('clock').textContent=fmtClock(Math.min(N.clock,CLOSE+0.99));
  $('dayFill').style.width=(Math.min(1,(N.clock-OPEN)/(CLOSE-OPEN))*100)+'%';
  $('clockNote').textContent=N.clock>=CLOSE?'閉店時間':N.clock>=LAST?'ラストオーダー':N.clock>=24?'深夜':N.clock>=21?'ピークタイム':'開店';
}

function ensureRoster(){
  const ids=CHARS.map(c=>c.id);
  const inWin=(id,h)=>{const c=CHAR_BY_ID[id];return h>=c.hours[0]&&h<c.hours[1]};
  if(!G.roster||!G.roster.length){
    const need=Math.min(ids.length,8+3*(G.night-1)); let best=null;
    for(let t=0;t<40;t++){
      const pick=shuffle(ids).slice(0,need);
      best=pick;
      if([19,20,21,22,23,24,25].every(h=>pick.filter(id=>inWin(id,h)).length>=2)) break;
    }
    G.roster=best; G.rosterNight=G.night; N_new=best.slice();
  }else if(G.rosterNight!==G.night){
    const rest=shuffle(ids.filter(id=>!G.roster.includes(id))).slice(0,3);
    G.roster=G.roster.concat(rest); G.rosterNight=G.night; N_new=rest;
  }else N_new=[];
}
let N_new=[];
function startNight(){
  D=DIFF[G.diff]; E=ECON[G.econ];
  ensureRoster();
  const absent=CHARS.filter(c=>G.mem[c.id].skip).map(c=>c.id);
  CHARS.forEach(c=>{G.mem[c.id].skip=false});
  N={seats:Array(D.seats).fill(null),active:-1,glass:[],sales:0,score:0,combo:0,maxCombo:0,perfect:0,customers:0,visits:{},mem:0,wild:0,lastDrink:null,results:[],notes:[],busy:null,clock:OPEN,sinceArrival:99,nextDelay:0,exhausted:false,ending:false,timer:null,lastActive:null,absent};
  $('overlay').hidden=true;
  $('recipes').hidden=!D.book;
  $('busy').hidden=true;
  $('toast').textContent='';
  $('loMark').style.left=((LAST-OPEN)/(CLOSE-OPEN)*100)+'%';
  renderShelf(); renderSeats(); renderActive(); renderBar(); renderStats(); renderClock();
  N.timer=setInterval(tick,100);
}

function activeCust(){return N&&N.active>=0?N.seats[N.active]:null}
function canMix(){const c=activeCust();return !!c&&!c.done&&c.order.kind!=='wild'&&!N.busy}

function seatNext(i,a){
  const cust={char:a.char,order:a.order}, o=cust.order, ch=cust.char, m=G.mem[ch.id];
  cust.seat=i; cust.done=false;
  cust.patienceMax=PATIENCE[o.kind]*D.pat; cust.patience=cust.patienceMax;
  cust.text=o.text;
  if(o.kind==='named'&&D.tell==='once'&&!G.learned[o.cocktail.name]){
    cust.text=`${o.cocktail.name}、ひとつ。${o.cocktail.ings.map(x=>BY_ID[x].name).join('と')}で作ってね。`;
    G.learned[o.cocktail.name]=true;
  }
  if(o.kind==='omakase'&&D.tell&&!m.prefKnown){cust.text=`おまかせで。${ch.pref}`;m.prefKnown=true}
  if(o.kind==='mood'){if(D.tell&&!G.moodKnown[o.moodKey]){cust.text+=' '+o.mood.hint;G.moodKnown[o.moodKey]=true}if(o.mood.patience)cust.patienceMax*=o.mood.patience,cust.patience=cust.patienceMax}
  if(o.count>1){cust.patienceMax*=1.8;cust.patience=cust.patienceMax}
  if(o.revisit) cust.text='また来ちゃった。'+cust.text;
  N.customers++; if(!STATS.met[ch.id]){STATS.met[ch.id]=1;saveStats();if(CHARS.every(c=>STATS.met[c.id]))unlock('meet_all')}
  N.seats[i]=cust; N.sinceArrival=0; N.nextDelay=arrivalGap();
  if(N.active<0||!N.seats[N.active]||N.seats[N.active].done) N.active=i;
  renderSeats(); renderActive(); renderBar();
}

function selectSeat(i){
  const c=N.seats[i]; if(!c||c.done||i===N.active) return;
  N.active=i; renderSeats(); renderActive(); renderBar();
}

function tick(){
  const dt=0.1;
  N.clock+=dt/SEC_PER_HOUR; N.sinceArrival+=dt;
  const free=N.seats.findIndex(s=>!s);
  if(N.clock<LAST&&!N.exhausted&&free>=0&&N.sinceArrival>=N.nextDelay){const a=pickArrival();if(a)seatNext(free,a);else N.exhausted=true}
  N.seats.forEach(c=>{
    if(!c||c.done) return;
    if(N.busy&&N.busy.cust===c) return;
    c.patience-=dt;
    if(c.patience<=0) leaveCust(c);
  });
  if(N.busy){
    N.busy.remaining-=dt; renderBusy();
    if(N.busy.remaining<=0){const b=N.busy;N.busy=null;$('busy').hidden=true;finishCust(b.cust,b.out);}
  }
  renderPatience(); renderClock();
  const empty=N.seats.every(s=>!s);
  if(!N.ending&&!N.busy&&empty&&(N.clock>=LAST||N.exhausted)){N.ending=true;clearInterval(N.timer);setTimeout(endNight,600)}
}

/* ---------- 操作 ---------- */
function addIng(ing){
  if(!canMix()) return;
  const have=N.glass.filter(g=>g.id===ing.id).length;
  if(G.stock[ing.id]<=have){toast(have?`${ing.name}はもう残りがない`:`${ing.name}を切らしてる！`);return}
  if(have>=2){toast(`${ing.name}はそれ以上入らない`);return}
  if(N.glass.length>=MAX){toast('グラスがいっぱい！');shakeGlass();return}
  N.glass.push(ing); renderGlass();
}
function removeIng(id){if(!canMix())return;const i=N.glass.map(g=>g.id).lastIndexOf(id);if(i>=0)N.glass.splice(i,1);renderGlass()}

function serve(){
  const cust=activeCust(); if(!canMix()) return;
  if(!N.glass.length){toast('グラスが空だよ！');shakeGlass();return}
  const o=cust.order, res=evaluate(cust);
  N.glass.forEach(i=>{G.stock[i.id]=Math.max(0,G.stock[i.id]-1);if(G.stock[i.id]<=0)N.stockout=true});
  const ids=N.glass.map(i=>i.id);
  N.glass=[];
  if(res.grade!=='fail') N.lastDrink={ids,name:cust.char.name};
  if(o.count>1){
    o.grades.push(res.grade); o.money+=res.money; o.served++;
    if(res.grade!=='fail'&&o.served<o.count){
      cust.text=`${o.cocktail.name}、あと${o.count-o.served}杯！`; toast(`${o.served}杯目、OK`);
      renderShelf(); renderActive(); renderBar(); return;
    }
    const grade=res.grade==='fail'?'fail':o.grades.includes('partial')?'partial':'perfect';
    const line=grade==='fail'?res.line:grade==='perfect'?`${cust.char.lines.ok} 乾杯！`:`${cust.char.lines.meh}（1杯、違うのが混ざってた）`;
    finishCust(cust,{grade,money:Math.round(o.money*0.8),line},ids); return;
  }
  finishCust(cust,res,ids);
}

function requiredIds(o){return o.kind==='named'?(o.mod==='na'?o.na:o.cocktail.ings):(o.kind==='repeat'||o.kind==='usual'||o.kind==='same')?o.glass:[]}
function substitute(){
  const cust=activeCust(); if(!cust||cust.done||N.busy) return;
  const ch=cust.char, m=G.mem[ch.id];
  cust.order={kind:'substitute',text:'そっか。じゃあ、何か合うのを見繕って。',label:'代わりの一杯',summary:'代わりの一杯',pay:350};
  cust.text=cust.order.text;
  if(D.tell&&!m.prefKnown){cust.text+=' '+ch.pref;m.prefKnown=true}
  renderSeats(); renderActive(); renderBar();
}

function choose(i){
  const cust=activeCust(); if(!cust||cust.done||cust.order.kind!=='wild'||N.busy) return;
  const c=cust.order.def.choices[i];
  let out=c;
  if(c.guess&&cust.char.name===c.guess) out={tip:500,line:'…え、なんで知ってるの！？'};
  else if(c.outcomes){const r=Math.random();let acc=0;out=c.outcomes[c.outcomes.length-1];for(const o of c.outcomes){acc+=o.p;if(r<acc){out=o;break}}}
  const grade=out.tip>=250?'perfect':out.tip>0?'partial':'fail';
  STATS.wild++; saveStats(); if(STATS.wild>=10)unlock('wild_all');
  if(c.guess&&cust.char.name===c.guess)unlock('tanaka_name');
  if(out.tip===-200)unlock('juggle_fail');
  if(cust.char.id==='sayuri'&&/熱唱/.test(c.label))unlock('sing_sayuri');
  const t=c.t||(0.5+Math.max(0,c.tip!=null?c.tip:250)/100);
  N.busy={cust,remaining:t,total:t,label:c.busy||c.label+'…',out:{grade,money:Math.round(out.tip*0.6),line:out.line}};
  $('busyLabel').textContent=N.busy.label; $('busyBar').style.width='0%'; $('busy').hidden=false;
  renderBar();
}
function renderBusy(){if(!N.busy)return;$('busyBar').style.width=(100*(1-N.busy.remaining/N.busy.total))+'%'}

/* ---------- 判定 ---------- */
function prefHint(ch,p){
  for(const t of ch.hates) if((p[t]||0)>0) return `${TAGWORD[t]}のは苦手なんだ`;
  for(const t of ch.likes) if((p[t]||0)<2) return `もっと${TAGWORD[t]}のがいい`;
  return '';
}
function evaluate(cust){
  const o=cust.order, ch=cust.char, glass=N.glass, L=ch.lines;
  const speed=Math.max(0,cust.patience/cust.patienceMax);
  const affMult=1+0.08*(G.mem[ch.id].aff||0);
  const pay=g=>g==='perfect'?Math.round((o.pay+150*speed)*affMult):g==='partial'?Math.round(o.pay*0.4):0;
  const got=glass.map(i=>i.id), b=balance(glass), distinct=new Set(got).size;
  let grade,line,bonus=0,read=false;
  if(o.kind==='named'&&o.mod==='na'){
    const target=o.na, c=countsOf(got);
    const spirits=got.filter(id=>BY_ID[id].tags.strong);
    const missing=target.filter(x=>!c[x]), extra=Object.keys(c).filter(x=>!target.includes(x));
    if(spirits.length){grade='fail';line=`${L.ng}（ノンアルって言ったのに！${BY_ID[spirits[0]].name}入ってる）`}
    else if(!missing.length&&!extra.length){grade='perfect';line=`${L.ok} 明日も頑張れる`}
    else{const j=(target.length-missing.length)/(target.length+extra.length);grade=j>=0.5?'partial':'fail';line=`${grade==='partial'?L.meh:L.ng}（${missing.length?`${BY_ID[missing[0]].name}が足りない気がする`:`${BY_ID[extra[0]].name}は余計かも`}）`}
  }else if(o.kind==='like'){
    const X=o.cocktail, j=msJaccard(got,X.ings), same=matchCocktail(glass)===X;
    if(same){grade='partial';line=`${L.meh}（それ、そのまま${X.name}じゃない？）`}
    else if(j<0.5){grade='fail';line=`${L.ng}（${X.name}の面影がない…）`}
    else if(b.tooStrong){grade='partial';line='…強すぎる。何杯分入れたの？'}
    else if(b.tooSweet){grade='partial';line='…甘すぎ。歯が溶けそう'}
    else{grade='perfect';const extra=got.find(id=>!X.ings.includes(id)),miss=X.ings.find(id=>!got.includes(id));line=extra?`お、${BY_ID[extra].name}を足したか。${L.ok}`:miss?`${BY_ID[miss].name}抜きか、いいね。${L.ok}`:`${L.ok} 濃さを変えてきたね`}
  }else if(o.kind==='mood'){
    const md=o.mood, p=profile(glass), conds=[];
    if(md.want) for(const k in md.want) conds.push((p[k]||0)>=md.want[k]);
    if(md.minStrong) conds.push((p.strong||0)>=md.minStrong);
    if(md.maxSweet!=null) conds.push((p.sweet||0)<=md.maxSweet);
    if(md.maxSpirits!=null) conds.push(b.spirits<=md.maxSpirits);
    if(md.minCount) conds.push(distinct>=md.minCount);
    const score=conds.length?conds.filter(Boolean).length/conds.length:1;
    grade=score===1?'perfect':score>=0.5?'partial':'fail';
    if(distinct<2&&grade==='perfect') grade='partial';
    if(grade==='perfect'&&b.tooStrong&&!(md.minStrong>=5)){grade='partial';line='…強すぎる。何杯分入れたの？'}
    if(grade==='perfect'&&b.tooSweet&&!(md.want&&md.want.sweet>=3)){grade='partial';line='…甘すぎ。歯が溶けそう'}
    if(!line) line=grade==='perfect'?md.ok:`${md.ng}${D.tell?`（${md.hint}）`:''}`;
  }else if(o.kind==='named'){
    const target=o.cocktail.ings, c=countsOf(got);
    const missing=target.filter(x=>!c[x]), extra=Object.keys(c).filter(x=>!target.includes(x));
    if(missing.length||extra.length){
      const j=(target.length-missing.length)/(target.length+extra.length);
      grade=j>=0.5?'partial':'fail';
      line=`${grade==='partial'?L.meh:L.ng}（${missing.length?`${BY_ID[missing[0]].name}が足りない気がする`:`${BY_ID[extra[0]].name}は余計かも`}）`;
    }else{
      const spirit=target.find(id=>BY_ID[id].tags.strong);
      const dblS=!!spirit&&c[spirit]>=2, dblM=target.some(id=>id!==spirit&&c[id]>=2);
      const v=dblS&&dblM?'both':dblS?'strong':dblM?'weak':null, mod=o.mod||null;
      if(v===mod){grade='perfect';line=mod?`${L.ok} 注文どおりだ`:L.ok}
      else if(!mod&&v==='strong'&&ch.likes.includes('strong')){grade='perfect';bonus=60;read=true;line=`${L.ok} 濃いめにしてくれたんだ。分かってるね`}
      else if(!mod&&v==='weak'&&ch.hates.includes('strong')){grade='perfect';bonus=60;read=true;line=`${L.ok} 薄めにしてくれたんだ。助かる`}
      else if(!mod){grade='partial';line=`${L.meh}（${v==='strong'?'濃すぎる':v==='weak'?'薄い…':'量が多すぎ'}）`}
      else{grade='partial';line=`${L.meh}（${mod==='strong'?'濃いめって言ったのに':'薄めって言ったのに'}）`}
    }
  }else if(o.kind==='repeat'||o.kind==='usual'||o.kind==='same'){
    const j=msJaccard(got,o.glass);
    grade=j===1?'perfect':j>=0.5?'partial':'fail';
    line=grade==='perfect'?(o.kind==='usual'?`${L.ok} さすが、覚えてるね`:o.kind==='same'?`${L.ok} 見てたんだ`:L.ok):`${grade==='partial'?L.meh:L.ng}（${o.kind==='same'?(j>=0.5?'さっきのと少し違う…':'さっきのと違う…'):(j>=0.5?'前のと少し違う…':'前のと違う…')}）`;
  }else if(o.kind==='abstract'){
    const d=o.def, p=profile(glass), conds=[];
    for(const k in (d.want||{})) conds.push((p[k]||0)>=d.want[k]);
    for(const k in (d.max||{})) conds.push((p[k]||0)<=d.max[k]);
    if(d.any) conds.push(Object.keys(d.any).some(k=>(p[k]||0)>=d.any[k]));
    const score=conds.length?conds.filter(Boolean).length/conds.length:1;
    grade=score===1?'perfect':score>=0.5?'partial':'fail';
    line=grade==='perfect'?d.ok:d.ng;
    if(distinct<2&&!d.soloOk&&grade==='perfect'){grade='partial';line=`…それ、${glass[0].name}そのままでは？`}
    if(grade==='perfect'&&b.tooStrong&&!(d.want&&d.want.strong>=5)){grade='partial';line='…強すぎる。何杯分入れたの？'}
    if(grade==='perfect'&&b.tooSweet&&!(d.want&&d.want.sweet>=3)){grade='partial';line='…甘すぎ。歯が溶けそう'}
  }else{ // omakase / substitute
    const p=profile(glass), conds=[];
    ch.likes.forEach(t=>conds.push((p[t]||0)>=2));
    ch.hates.forEach(t=>conds.push((p[t]||0)===0));
    const score=conds.filter(Boolean).length/conds.length;
    grade=score===1?'perfect':score>=0.5?'partial':'fail';
    if(distinct<2&&grade==='perfect') grade='partial';
    if(grade==='perfect'&&b.tooStrong&&!ch.likes.includes('strong')){grade='partial';line='…強すぎる。何杯分入れたの？'}
    if(grade==='perfect'&&b.tooSweet&&!ch.likes.includes('sweet')){grade='partial';line='…甘すぎ。歯が溶けそう'}
    const c=matchCocktail(glass);
    if(!line) line=grade==='perfect'?(c?`お、${c.name}か。${L.ok}`:L.ok):`${grade==='partial'?L.meh:L.ng}（${prefHint(ch,p)||'なんか違う'}）`;
  }
  return {grade,money:pay(grade)+bonus,line,read};
}

/* ---------- 客の退場・記憶 ---------- */
function remember(cust,grade,ids){
  const m=G.mem[cust.char.id], nm=cust.char.name; m.visits++;
  if(grade==='perfect'){const b=m.aff;m.aff=Math.min(5,m.aff+1);if(b<2&&m.aff>=2)N.notes.push(`${nm}が常連になった ★★`);else if(b<5&&m.aff===5)N.notes.push(`${nm}は店の顔になった ★★★★★`)}
  else if(grade==='fail'||grade==='left'){m.aff=Math.max(0,m.aff-1);m.skip=true;N.notes.push(grade==='left'?`${nm}は待ちきれずに帰った。明日は来ない…`:`${nm}はご機嫌ななめ。明日は来ない…`)}
  if(ids&&grade!=='fail') m.last=ids;
  if(ids&&grade==='perfect'&&!m.usual) m.usual=ids;
}
function finishCust(cust,res,ids){
  cust.done=true; cust.res=res;
  N.sales+=res.money; G.money+=res.money;
  let pts=0;
  if(res.grade==='perfect'){
    N.perfect++; N.combo++; N.maxCombo=Math.max(N.maxCombo,N.combo);
    const speed=Math.max(0,cust.patience/cust.patienceMax), k=cust.order.kind;
    const base=100*(1+speed)+(k==='usual'||k==='repeat'||k==='same'?50:0)+(k==='like'||k==='mood'?40:0)+(cust.order.count>1?60:0)+(cust.order.mod?30:0)+10*(G.mem[cust.char.id].aff||0);
    pts=Math.round(base*Math.min(2,1+0.1*(N.combo-1)));
  }else if(res.grade==='partial'){pts=30;N.combo=0}
  else N.combo=0;
  res.pts=pts; res.combo=N.combo; N.score+=pts;
  N.results.push({char:cust.char,grade:res.grade});
  const k=cust.order.kind;
  if(res.grade==='perfect'){
    unlock('first_perfect'); if(N.combo>=5)unlock('combo5'); if(N.combo>=10)unlock('combo10');
    if(k==='like')unlock('like_perfect'); if(k==='usual')unlock('usual_perfect'); if(k==='same')unlock('same_perfect');
    if(cust.order.count>1)unlock('bulk_perfect'); if(cust.order.mod==='na')unlock('na_perfect'); if(res.read)unlock('strong_read');
    if(k==='mood'){STATS.moods[cust.order.moodKey]=1;saveStats();if(Object.keys(MOODS).every(m=>STATS.moods[m]))unlock('mood_all')}
  }
  if(/強すぎる/.test(res.line||''))unlock('too_strong');
  remember(cust,res.grade,ids);
  renderSeats(); renderStats(); renderShelf();
  if(N.active===cust.seat){renderActive();renderBar()}
  setTimeout(()=>{
    if(N.seats[cust.seat]===cust) N.seats[cust.seat]=null;
    if(N.active===cust.seat) N.active=N.seats.findIndex(s=>s&&!s.done);
    renderSeats(); renderActive(); renderBar();
  },1800);
}
function leaveCust(cust){finishCust(cust,{grade:'left',money:0,line:'…もういいや。（帰ってしまった）'})}

  const opts=(obj,attr,sel)=>Object.entries(obj).map(([k,d])=>`<button class="diff ${k===sel?'sel':''}" data-${attr}="${k}"><b>${d.name}</b><small>${d.desc}</small></button>`).join('');
  $('card').innerHTML=`<h1>🍸 Bar Shaker</h1><p>一週間、バーのカウンターに立つ。<br>常連を増やし、仕入れをやりくりし、無茶ぶりをさばこう。</p><div class="cast">${cast}</div>
  ${s?`<button id="cont">続きから（夜${s.night}・${DIFF[s.diff].name}・${ECON[s.econ].name}・${yen(s.money)}）</button><hr>`:''}
  <p class="sec">腕前</p><div class="diffs" id="diffRow">${opts(DIFF,'d',selDiff)}</div>
  <p class="sec">お金</p><div class="diffs" id="econRow">${opts(ECON,'e',selEcon)}</div>
  <p id="hiLine"></p>
  <button id="go">開店する</button><br><button id="achBtn" class="ghost small">🏆 実績 ${Object.keys(loadAch()).length}/${ACH.length}</button>`;
  $('overlay').hidden=false;
  if(s) $('cont').onclick=()=>continueGame(s);
  const pick=(row,attr,setter)=>row.querySelectorAll('.diff').forEach(b=>b.onclick=()=>{setter(b.dataset[attr]);row.querySelectorAll('.diff').forEach(x=>x.classList.toggle('sel',x===b))});
  const hiLine=()=>{const h=loadHi()[selDiff+'-'+selEcon];$('hiLine').innerHTML=h?`ハイスコア <span class="hi">${h.week.toLocaleString()} pt</span> / 週　<span class="hi">${h.night.toLocaleString()} pt</span> / 夜`:'ハイスコア: まだなし'};
  pick($('diffRow'),'d',v=>{selDiff=v;hiLine()}); pick($('econRow'),'e',v=>{selEcon=v;hiLine()}); hiLine();
  $('go').onclick=()=>newGame(selDiff,selEcon);
  $('achBtn').onclick=showAch;
}
function showAch(){
  const a=loadAch(); const cats=['技','店','遊び','人'];
  const list=cats.map(c=>`<h4>${c}</h4>`+ACH.filter(x=>x.cat===c).map(x=>{const on=!!a[x.id];return `<div class="ach ${on?'':'locked'}"><span class="ic">${on?'🏆':x.hidden?'❓':'🔒'}</span><div><b>${on?esc(x.name):x.hidden?'？？？':esc(x.name)}</b><small>${esc(x.desc)}</small></div></div>`}).join('')).join('');
  $('card').innerHTML=`<h1>🏆 実績</h1><p>${Object.keys(a).length} / ${ACH.length}</p><div class="achlist">${list}</div><button id="back" class="ghost">戻る</button>`;
  $('overlay').hidden=false; $('back').onclick=showTitle;
}

$('serve').onclick=serve;
$('clear').onclick=()=>{if(!canMix())return;N.glass=[];renderGlass()};
$('subst').onclick=substitute;
$('seats').onclick=e=>{const s=e.target.closest('.seat[data-i]');if(s)selectSeat(+s.dataset.i)};

renderRecipes(); renderShelf(); showTitle();
</script>
</body>
</html>
